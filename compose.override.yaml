---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # Restringe o watcher a código/config versionado: sem watch em var/,
      # PHPStan/testes/cache não reiniciam os threads do FrankenPHP.
      FRANKENPHP_WORKER_CONFIG: |
        watch /app/src
        watch /app/config
        watch /app/templates
        watch /app/translations
        watch /app/migrations
        watch /app/public
        watch /app/tests
        watch /app/.env
        watch /app/composer.json
      FRANKENPHP_SITE_CONFIG: |
        hot_reload {
          watch /app/src
          watch /app/config
          watch /app/templates
          watch /app/translations
          watch /app/migrations
          watch /app/public
          watch /app/tests
          watch /app/.env
          watch /app/composer.json
        }
      # O hub do FrankenPHP atual não aceita mais a diretiva `demo`. O Caddyfile
      # já injeta `{$MERCURE_EXTRA_DIRECTIVES}`; defina extras aqui se precisar.
      MERCURE_EXTRA_DIRECTIVES: "${MERCURE_EXTRA_DIRECTIVES:-cors_origins http://localhost:3000}"
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

  worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"
    extra_hosts:
      - host.docker.internal:host-gateway
    # O entrypoint do projeto roda migrations; o worker espera o php saudável
    # para não duplicar esse trabalho.
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "messenger:consume", "scheduler_activities", "scheduler_gamification", "scheduler_groups", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemadesenha}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3902:3902"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-profile-images}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-!ChangeMe!}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-!ChangeMe!}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-!ChangeMe!}

    command: /garage server --single-node --default-bucket
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

volumes:
  pgdata:
  garage-meta:
  garage-data:
