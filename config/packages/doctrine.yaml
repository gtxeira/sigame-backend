doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            uuid: App\Shared\Infrastructure\Persistence\ORM\Type\UuidType
            user_id: App\Shared\Infrastructure\Persistence\ORM\Type\UserIdType
            email: App\Shared\Infrastructure\Persistence\ORM\Type\EmailType
            cpf: App\Shared\Infrastructure\Persistence\ORM\Type\CpfType
            hashed_password: App\Shared\Infrastructure\Persistence\ORM\Type\HashedPasswordType
            user_level: App\Shared\Infrastructure\Persistence\ORM\Type\UserLevelType

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Entity'
                prefix: 'App\Identity\Domain\Entity'
                alias: Identity
            Groups:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Groups/Domain/Entity'
                prefix: 'App\Groups\Domain\Entity'
                alias: Groups
            Activities:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Activities/Domain/Entity'
                prefix: 'App\Activities\Domain\Entity'
                alias: Activities
            Gamification:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Gamification/Domain/Entity'
                prefix: 'App\Gamification\Domain\Entity'
                alias: Gamification
            Moderation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Moderation/Domain/Entity'
                prefix: 'App\Moderation\Domain\Entity'
                alias: Moderation
            Sponsorship:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sponsorship/Domain/Entity'
                prefix: 'App\Sponsorship\Domain\Entity'
                alias: Sponsorship
            Notifications:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notifications/Domain/Entity'
                prefix: 'App\Notifications\Domain\Entity'
                alias: Notifications
            Reports:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reports/Domain/Entity'
                prefix: 'App\Reports\Domain\Entity'
                alias: Reports

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
