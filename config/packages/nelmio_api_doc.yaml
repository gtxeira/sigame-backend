nelmio_api_doc:
    documentation:
        info:
            title: SIGAME API
            description: API da plataforma web voltada ao incentivo à prática de atividades físicas em grupo.
            version: 1.0.0

        components:
            schemas:
                ApiResponseMeta:
                    type: object
                    description: Metadados padrão de todas as respostas da API.
                    properties:
                        timestamp:
                            type: string
                            example: "2026-09-21T10:00:00.000+00:00"
                    required:
                        - timestamp

                PaginationMeta:
                    type: object
                    description: Metadados de paginação.
                    properties:
                        page:
                            type: integer
                            example: 1
                        perPage:
                            type: integer
                            example: 20
                        total:
                            type: integer
                            example: 100
                        totalPages:
                            type: integer
                            example: 5

                ApiResponsePaginatedMeta:
                    allOf:
                        -   $ref: "#/components/schemas/ApiResponseMeta"
                        -   type: object
                            properties:
                                pagination:
                                    $ref: "#/components/schemas/PaginationMeta"
                            required:
                                - pagination

                ApiErrorDetail:
                    type: object
                    description: Detalhe de um erro de validação.
                    properties:
                        field:
                            type: string
                            example: "email"
                        message:
                            type: string
                            example: "Este campo é obrigatório."

                ApiErrorItem:
                    type: object
                    description: Um item de erro retornado pela API.
                    properties:
                        code:
                            type: string
                            example: "VALIDATION_ERROR"
                        message:
                            type: string
                            example: "Um ou mais erros de validação foram encontrados."
                        details:
                            type: array
                            items:
                                $ref: "#/components/schemas/ApiErrorDetail"
                    required:
                        - code
                        - message

                ApiResponseSuccess:
                    type: object
                    description: Resposta de sucesso padrão.
                    properties:
                        data:
                            description: Dados da resposta.
                        meta:
                            $ref: "#/components/schemas/ApiResponseMeta"
                    required:
                        - data
                        - meta

                ApiResponsePaginatedSuccess:
                    type: object
                    description: Resposta de sucesso com lista paginada.
                    properties:
                        data:
                            type: array
                            items:
                                type: object
                            description: Lista de itens paginados.
                        meta:
                            $ref: "#/components/schemas/ApiResponsePaginatedMeta"
                    required:
                        - data
                        - meta

                ApiResponseError:
                    type: object
                    description: Resposta de erro padrão.
                    properties:
                        errors:
                            type: array
                            items:
                                $ref: "#/components/schemas/ApiErrorItem"
                        meta:
                            $ref: "#/components/schemas/ApiResponseMeta"
                    required:
                        - errors
                        - meta

    areas:
        path_patterns:
            - ^/api(?!/doc$)

    type_info: true
