# Catálogo de casos de uso do SIGAME.
#
# Esta é a fonte única dos diagramas de caso de uso e da matriz de
# rastreabilidade. `just docs-usecases` valida este arquivo contra:
#   - os requisitos funcionais de docs/requisitos/levantamento-de-requisitos.md;
#   - a tabela de atores da seção 3.1 do mesmo documento;
#   - as rotas /api/v1 registradas no Router.
#
# Regras aplicadas pelo comando `app:docs:usecases`:
#   - todo RF precisa de pelo menos um caso de uso;
#   - todo caso de uso aponta para um RF existente e atores existentes;
#   - toda rota /api/v1 precisa estar em pelo menos um caso implementado;
#   - caso implementado com `api: true` precisa de rota;
#   - caso com `api: false` precisa de `motivo_sem_api`;
#   - caso roadmap/adiado não pode ter rota;
#   - `inclui`/`estende` precisam existir e ficar no mesmo diagrama, sem ciclos.
#
# Status: `implementado`, `roadmap` (planejado) ou `adiado` (fora da V1).
# O bloco `api` indica se o caso é exposto por endpoint HTTP.

versao: 1

sistema:
  id: sigame
  nome: SIGAME
  descricao: Plataforma de atividades físicas em grupo.

atores:
  usuario:
    nome: Usuário
    descricao: Pessoa cadastrada que participa do SIGAME.
  admin_grupo:
    nome: Administrador de grupo
    descricao: Criador ou responsável pela gestão de um grupo específico.
  supervisor:
    nome: Supervisor
    descricao: Membro aprovado designado para operar atividades no dia.
  admin_sigame:
    nome: Administração SIGAME
    descricao: Administração global da plataforma.
  patrocinador:
    nome: Patrocinador
    descricao: Entidade responsável por proposta de benefício, prevista para o roadmap.
  sistema:
    nome: Sistema (agendador)
    descricao: Rotina automática ou worker, sem interação humana.
    sintetico: true

# Título e ordem dos diagramas detalhados. O diagrama `geral` é gerado à parte,
# com um caso de uso por RF.
diagramas:
  conta: Conta e cadastro
  autenticacao: Autenticação e sessão
  onboarding: Onboarding e modalidades
  grupos: Grupos e comunicação
  participacao: Participação e papéis
  atividades: Atividades
  presenca: Inscrição e presença
  gamificacao: Gamificação e progressão
  notificacoes: Notificações
  contas: Contas (administração)
  console: Console administrativo
  moderacao: Moderação (adiada)
  patrocinio: Patrocínio e vouchers (roadmap)
  relatorios: Relatórios (roadmap)

